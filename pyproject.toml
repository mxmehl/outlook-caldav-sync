[project]
name = "outlook-caldav-sync"
version = "0.1.0"
description = ""
authors = [{ name = "Max Mehl", email = "mail@mehl.mx" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["icalendar (>=6.2.0,<7.0.0)", "caldav (>=1.4.0,<2.0.0)"]

scripts = { "outlook-caldav-sync" = "outlook_caldav_sync.main:main" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
bump-my-version = "^1.1.2"
pylint = "^3.3.7"
isort = "^6.0.1"
black = "^25.1.0"
mypy = "^1.15.0"
types-pytz = "^2025.2.0.20250326"
types-requests = "^2.32.0.20250328"
types-icalendar = "^6.1.3.20250403"
pytest = "^8.3.5"

# FORMATTING settings
[tool.isort]
profile = "black"

[tool.black]
line-length = 100

# MYPY settings
[tool.mypy]
files = ["outlook_caldav_sync/*.py", "tests/*.py"]
disable_error_code = ["import-untyped"]

# Bump-My-Version
[tool.bumpversion]
commit = true
tag = true
allow_dirty = false
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""
